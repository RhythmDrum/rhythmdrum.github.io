 </style>

 <script>
  (function() {
    if (location.search.indexOf('lang=en') !== -1) return;

    var isJapanese = false;

    var langs = navigator.languages || [navigator.language || navigator.userLanguage || ''];
    for (var i = 0; i < langs.length; i++) {
      if (langs[i].toLowerCase().startsWith('ja')) {
        isJapanese = true;
        break;
      }
    }

    try {
      var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (tz === 'Asia/Tokyo') {
        isJapanese = true;
      }
    } catch(e) {}

    if (isJapanese) {
      location.replace('index-jp.html');
    }
  })();
 </script>
